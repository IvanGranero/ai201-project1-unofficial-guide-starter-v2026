<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CVE Guide</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        color: #172033;
        background: #f3f5f8;
      }

      body {
        margin: 0;
        padding: 2rem 1rem;
      }

      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 2rem;
        background: #fff;
        border: 1px solid #dce1e8;
        border-radius: 12px;
        box-shadow: 0 8px 28px rgb(23 32 51 / 8%);
      }

      h1, h2, h3 {
        line-height: 1.2;
      }

      p {
        line-height: 1.55;
      }

      label {
        display: block;
        margin: 1.5rem 0 0.5rem;
        font-weight: 650;
      }

      textarea {
        box-sizing: border-box;
        width: 100%;
        min-height: 7rem;
        padding: 0.75rem;
        border: 1px solid #9aa5b5;
        border-radius: 6px;
        font: inherit;
        resize: vertical;
      }

      button {
        margin-top: 0.75rem;
        padding: 0.65rem 1rem;
        border: 0;
        border-radius: 6px;
        background: #174ea6;
        color: #fff;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      #status {
        min-height: 1.5em;
      }

      #answer-section {
        margin-top: 1.5rem;
        padding-top: 0.5rem;
        border-top: 1px solid #dce1e8;
      }

      #answer {
        white-space: pre-wrap;
      }

      li + li {
        margin-top: 0.35rem;
      }

      @media (max-width: 520px) {
        body {
          padding: 0.75rem;
        }

        main {
          padding: 1.25rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>CVE Guide</h1>
      <p>Ask a question about the CVE records in this collection.</p>

      <form id="ask-form">
        <label for="question">Your question</label>
        <textarea
          id="question"
          name="question"
          maxlength="2000"
          placeholder="For example: What does CVE-2026-41677 affect?"
          required
        ></textarea>
        <button id="submit-button" type="submit">Ask</button>
      </form>

      <p id="status" role="status" aria-live="polite"></p>

      <section id="answer-section" aria-labelledby="answer-heading" hidden>
        <h2 id="answer-heading">Answer</h2>
        <p id="answer"></p>
        <h3>Sources</h3>
        <ul id="sources"></ul>
      </section>
    </main>

    <script>
      const form = document.querySelector("#ask-form");
      const questionField = document.querySelector("#question");
      const submitButton = document.querySelector("#submit-button");
      const status = document.querySelector("#status");
      const answerSection = document.querySelector("#answer-section");
      const answerText = document.querySelector("#answer");
      const sourcesList = document.querySelector("#sources");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        submitButton.disabled = true;
        status.textContent = "Searching the CVE collection...";
        answerSection.hidden = true;
        sourcesList.replaceChildren();

        try {
          const response = await fetch("/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question: questionField.value.trim() }),
          });
          const result = await response.json();

          if (!response.ok) {
            throw new Error(result.error || `Request failed (${response.status}).`);
          }

          answerText.textContent = result.answer;
          for (const source of result.sources || []) {
            const item = document.createElement("li");
            item.textContent = source;
            sourcesList.append(item);
          }
          answerSection.hidden = false;
          status.textContent = result.refused
            ? "The system could not find enough supporting information."
            : "Answer ready.";
        } catch (error) {
          status.textContent = error.message || "Could not reach the service.";
        } finally {
          submitButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
